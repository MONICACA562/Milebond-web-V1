name: Update Sitemap

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'   # 每天 UTC 18:00（北京时间凌晨 2 点）自动跑一次
  workflow_dispatch:        # 也支持手动触发

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history: lastmod is taken from each file's last commit date.
          # A shallow clone (default depth 1) makes `git log -1 -- <file>` empty
          # for every file not touched by HEAD, so all URLs fall back to today.
          fetch-depth: 0

      - name: Generate sitemap.xml
        run: |
          cat > generate_sitemap.py << 'EOF'
          import os, subprocess, datetime, json

          TODAY = datetime.date.today().isoformat()

          def last_commit_date(rel):
              # File mtime is just the checkout time in CI — use the real commit date.
              try:
                  out = subprocess.check_output(
                      ['git', 'log', '-1', '--format=%cs', '--', rel], text=True).strip()
                  return out or TODAY
              except Exception:
                  return TODAY

          # Non-content directories and files
          SKIP_DIRS = {'.github', '.git', 'node_modules', 'assets', 'images',
                       'downloads', 'preview', 'scripts', 'data', 'screenshots',
                       'blog-next', '.vscode', '__pycache__', '_next'}
          SKIP_FILES = {'404.html', 'index-legacy.html', 'thank-you.html'}
          # Pages that 301 elsewhere — never list them in the sitemap
          REDIRECTED = {
              '/products/outdoor-sports',
              '/products/all-products',
              '/services/supplier-verification',
              '/services/factory-audit',
              '/services/amazon-fba-prep-labeling',
          }

          # hreflang alternates for registered translations that are already live.
          # Drafts and planned locales are ignored, so no alternate points at a
          # page that does not exist yet.
          alternates = {}
          try:
              with open('data/i18n-pages.json', encoding='utf-8') as fh:
                  registry = json.load(fh)
              live = {code for code, cfg in (registry.get('locales') or {}).items()
                      if cfg.get('status') == 'live'}
              default = registry.get('defaultLocale', 'en')
              for page in registry.get('pages', []):
                  translations = {code: cfg for code, cfg in (page.get('translations') or {}).items()
                                  if code in live and cfg.get('status') == 'live'}
                  if len(translations) < 2:
                      continue
                  default_path = (translations.get(default) or {}).get('path')
                  for code, cfg in translations.items():
                      loc_key = 'https://www.milebond.com' + cfg['path']
                      links = []
                      if default_path:
                          links.append(('x-default', 'https://www.milebond.com' + default_path))
                      links.extend((other, 'https://www.milebond.com' + other_cfg['path'])
                                   for other, other_cfg in translations.items())
                      alternates[loc_key] = links
          except Exception as exc:
              print('i18n alternates skipped:', exc)

          urls = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in SKIP_DIRS and d != 'draft' and not d.startswith('_draft')]
              for f in files:
                  if not f.endswith('.html'):
                      continue
                  rel = os.path.relpath(os.path.join(root, f), '.').replace(os.sep, '/')
                  if rel in SKIP_FILES:
                      continue
                  if rel == 'index.html':
                      path = '/'
                  elif f == 'index.html':
                      path = '/' + os.path.dirname(rel) + '/'
                  else:
                      # Serving layer 308s *.html to the clean URL
                      path = '/' + rel[:-5]
                  if path.rstrip('/') in REDIRECTED:
                      continue
                  loc = 'https://www.milebond.com' + path
                  urls.append((loc, last_commit_date(rel)))

          urls = sorted(set(urls))
          with open('sitemap.xml', 'w') as out:
              out.write('<?xml version="1.0" encoding="UTF-8"?>\n')
              ns = ' xmlns:xhtml="http://www.w3.org/1999/xhtml"' if alternates else ''
              out.write('<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"' + ns + '>\n')
              for loc, lastmod in urls:
                  # No changefreq: Google and Bing ignore it, and a uniform
                  # "weekly" on every URL is noise rather than a signal.
                  links = alternates.get(loc)
                  if links:
                      out.write(f'  <url><loc>{loc}</loc><lastmod>{lastmod}</lastmod>\n')
                      for hreflang, href in links:
                          out.write(f'    <xhtml:link rel="alternate" hreflang="{hreflang}" href="{href}"/>\n')
                      out.write('  </url>\n')
                  else:
                      out.write(f'  <url><loc>{loc}</loc><lastmod>{lastmod}</lastmod></url>\n')
              out.write('</urlset>\n')
          print(f'Generated sitemap with {len(urls)} URLs')
          EOF
          python3 generate_sitemap.py

      - name: Commit sitemap.xml if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes to sitemap.xml"
          else
            git commit -m "chore: auto-update sitemap.xml"
            git push
          fi
