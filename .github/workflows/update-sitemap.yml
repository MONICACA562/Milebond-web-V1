name: Update Sitemap

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'   # 每天 UTC 18:00（北京时间凌晨 2 点）自动跑一次
  workflow_dispatch:        # 也支持手动触发

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate sitemap.xml
        run: |
          cat > generate_sitemap.py << 'EOF'
          import os, subprocess, datetime

          TODAY = datetime.date.today().isoformat()

          def last_commit_date(rel):
              # File mtime is just the checkout time in CI — use the real commit date.
              try:
                  out = subprocess.check_output(
                      ['git', 'log', '-1', '--format=%cs', '--', rel], text=True).strip()
                  return out or TODAY
              except Exception:
                  return TODAY

          # Non-content directories and files
          SKIP_DIRS = {'.github', '.git', 'node_modules', 'assets', 'images',
                       'downloads', 'preview', 'scripts', 'data', 'screenshots',
                       'blog-next', '.vscode', '__pycache__', '_next'}
          SKIP_FILES = {'404.html', 'index-legacy.html'}
          # Pages that 301 elsewhere — never list them in the sitemap
          REDIRECTED = {
              '/products/outdoor-sports',
              '/products/all-products',
              '/services/supplier-verification',
              '/services/factory-audit',
              '/services/amazon-fba-prep-labeling',
          }

          urls = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in SKIP_DIRS]
              for f in files:
                  if not f.endswith('.html'):
                      continue
                  rel = os.path.relpath(os.path.join(root, f), '.').replace(os.sep, '/')
                  if rel in SKIP_FILES:
                      continue
                  if rel == 'index.html':
                      path = '/'
                  elif f == 'index.html':
                      path = '/' + os.path.dirname(rel) + '/'
                  else:
                      # Serving layer 308s *.html to the clean URL
                      path = '/' + rel[:-5]
                  if path.rstrip('/') in REDIRECTED:
                      continue
                  loc = 'https://www.milebond.com' + path
                  urls.append((loc, last_commit_date(rel)))

          urls = sorted(set(urls))
          with open('sitemap.xml', 'w') as out:
              out.write('<?xml version="1.0" encoding="UTF-8"?>\n')
              out.write('<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n')
              for loc, lastmod in urls:
                  out.write(f'  <url><loc>{loc}</loc><lastmod>{lastmod}</lastmod><changefreq>weekly</changefreq></url>\n')
              out.write('</urlset>\n')
          print(f'Generated sitemap with {len(urls)} URLs')
          EOF
          python3 generate_sitemap.py

      - name: Commit sitemap.xml if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes to sitemap.xml"
          else
            git commit -m "chore: auto-update sitemap.xml [skip ci]"
            git push
          fi
