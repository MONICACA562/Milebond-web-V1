<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>

  <!-- Title section -->
  <text x="600" y="55" text-anchor="middle" fill="#0f172a" font-size="30" font-weight="800">The 5-Question Pre-Order Checklist</text>
  <text x="600" y="85" text-anchor="middle" fill="#64748b" font-size="16">Ask these before paying any agent. Print this page.</text>
  <line x1="400" y1="100" x2="800" y2="100" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>

  <!-- Row 1 -->
  <g transform="translate(60, 120)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="none" stroke="#22c55e" stroke-width="3"/>
    <text x="0" y="60" fill="#0f172a" font-size="20" font-weight="700">Can you provide the full 1688 order detail screenshot — with order number, supplier name, and Alipay transaction number?</text>
    <text x="0" y="85" fill="#64748b" font-size="14">Expected from transparent agent: Complete, uncropped screenshot within 24 hours</text>
    <line x1="0" y1="105" x2="1080" y2="105" stroke="#e2e8f0" stroke-width="1"/>
  </g>

  <!-- Row 2 -->
  <g transform="translate(60, 240)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="none" stroke="#22c55e" stroke-width="3"/>
    <text x="0" y="60" fill="#0f172a" font-size="20" font-weight="700">Can you provide the freight forwarder's original invoice for shipping?</text>
    <text x="0" y="85" fill="#64748b" font-size="14">Expected from transparent agent: Branded, itemized invoice with invoice number — not a self-made Excel</text>
    <line x1="0" y1="105" x2="1080" y2="105" stroke="#e2e8f0" stroke-width="1"/>
  </g>

  <!-- Row 3 -->
  <g transform="translate(60, 360)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="none" stroke="#22c55e" stroke-width="3"/>
    <text x="0" y="60" fill="#0f172a" font-size="20" font-weight="700">Can you show me the negotiation chat log with the factory?</text>
    <text x="0" y="85" fill="#64748b" font-size="14">Expected from transparent agent: Wangwang/WeChat screenshots with genuine back-and-forth negotiation</text>
    <line x1="0" y1="105" x2="1080" y2="105" stroke="#e2e8f0" stroke-width="1"/>
  </g>

  <!-- Row 4 -->
  <g transform="translate(60, 480)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="none" stroke="#22c55e" stroke-width="3"/>
    <text x="0" y="60" fill="#0f172a" font-size="20" font-weight="700">Can you itemize packaging costs and provide the packaging factory's original quote?</text>
    <text x="0" y="85" fill="#64748b" font-size="14">Expected from transparent agent: Separate line item with factory name and per-unit cost</text>
    <line x1="0" y1="105" x2="1080" y2="105" stroke="#e2e8f0" stroke-width="1"/>
  </g>

  <!-- Row 5 -->
  <g transform="translate(60, 600)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="none" stroke="#22c55e" stroke-width="3"/>
    <text x="0" y="60" fill="#0f172a" font-size="20" font-weight="700">Can you arrange a pre-shipment video from my specified factory — showing the factory sign and my product on the line?</text>
    <text x="0" y="85" fill="#64748b" font-size="14">Expected from transparent agent: Video within 48 hours with all requested identifying markers</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="730" width="1200" height="70" fill="#ef4444"/>
  <text x="600" y="765" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">If they can't answer all 5 — walk away.</text>
  <text x="600" y="790" text-anchor="middle" fill="#ffffff" font-size="12" opacity="0.85">A transparent agent has nothing to hide. A black-box agent has everything to hide.</text>
</svg>