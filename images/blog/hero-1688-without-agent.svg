<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <!-- Background split -->
  <defs>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Left panel: dark -->
  <rect x="0" y="0" width="600" height="630" fill="url(#navyGrad)"/>
  <!-- Right panel: light -->
  <rect x="600" y="0" width="600" height="630" fill="#f8fafc"/>
  <!-- Bottom bar -->
  <rect x="0" y="570" width="1200" height="60" fill="#0f172a"/>

  <!-- Left title -->
  <text x="300" y="80" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="800" letter-spacing="1">WHAT THEY SHOW YOU</text>

  <!-- Left order card -->
  <g filter="url(#cardShadow)">
    <rect x="80" y="140" width="440" height="220" rx="16" fill="#ffffff"/>
  </g>
  <text x="110" y="190" fill="#64748b" font-size="14" font-weight="500">1688 Order Total</text>
  <!-- Tampered amount with red overlay -->
  <g>
    <text x="110" y="270" fill="#0f172a" font-size="54" font-weight="800">$5,299.00</text>
    <!-- Red smudge overlay -->
    <rect x="240" y="215" width="180" height="60" fill="#ef4444" opacity="0.35" rx="6" transform="rotate(-3 330 245)"/>
    <rect x="260" y="225" width="120" height="38" fill="#ef4444" opacity="0.5" rx="4"/>
  </g>
  <text x="110" y="310" fill="#94a3b8" font-size="13" font-weight="500">Agent-provided screenshot</text>
  <!-- Fake UI elements -->
  <rect x="110" y="330" width="100" height="6" fill="#e2e8f0" rx="3"/>
  <rect x="110" y="344" width="70" height="6" fill="#e2e8f0" rx="3"/>

  <!-- Right title -->
  <text x="900" y="80" text-anchor="middle" fill="#16a34a" font-size="26" font-weight="800" letter-spacing="1">WHAT REALLY HAPPENED</text>

  <!-- Right order card -->
  <g filter="url(#cardShadow)">
    <rect x="680" y="140" width="440" height="220" rx="16" fill="#ffffff"/>
  </g>
  <text x="710" y="190" fill="#64748b" font-size="14" font-weight="500">1688 Order Total</text>
  <text x="710" y="270" fill="#16a34a" font-size="54" font-weight="800">$4,120.00</text>
  <!-- Green checkmark -->
  <circle cx="1070" cy="195" r="22" fill="#22c55e"/>
  <polyline points="1057,195 1067,205 1083,188" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="710" y="310" fill="#94a3b8" font-size="13" font-weight="500">Verified factory invoice</text>
  <!-- Real UI elements -->
  <rect x="710" y="330" width="140" height="6" fill="#e2e8f0" rx="3"/>
  <rect x="710" y="344" width="90" height="6" fill="#e2e8f0" rx="3"/>

  <!-- Center divider with VS -->
  <line x1="600" y1="0" x2="600" y2="570" stroke="#ffffff" stroke-width="2"/>
  <circle cx="600" cy="370" r="38" fill="#0f172a"/>
  <text x="600" y="380" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">VS</text>

  <!-- Bottom bar text -->
  <text x="40" y="608" fill="#ffffff" font-size="18" font-weight="700">milebond.com — Transparent Sourcing. No Hidden Fees.</text>
  <text x="1160" y="608" text-anchor="end" fill="#f59e0b" font-size="14" font-weight="600">Fee-only. Verified. Guaranteed.</text>
</svg>