<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="1200" height="900" fill="#ffffff"/>

  <!-- Title section -->
  <text x="600" y="60" text-anchor="middle" fill="#0f172a" font-size="30" font-weight="800">5 Ways "3% Agents" Secretly Earn 10-30% More</text>
  <text x="600" y="90" text-anchor="middle" fill="#64748b" font-size="16">Industry-standard tactics — and how to detect each one</text>
  <line x1="400" y1="105" x2="800" y2="105" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

  <!-- Row 1 -->
  <g transform="translate(0, 130)">
    <circle cx="60" cy="50" r="45" fill="#0f172a"/>
    <text x="60" y="60" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="800">01</text>
    <!-- Icon: screenshot + magic wand -->
    <g transform="translate(115, 30)" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="5" width="38" height="26" rx="3"/>
      <rect x="5" y="10" width="28" height="4" fill="#e2e8f0" stroke="none"/>
      <rect x="5" y="17" width="20" height="4" fill="#e2e8f0" stroke="none"/>
      <line x1="42" y1="28" x2="50" y2="36"/>
      <line x1="50" y1="22" x2="58" y2="30"/>
      <line x1="48" y1="30" x2="56" y2="38"/>
      <circle cx="60" cy="38" r="2" fill="#f59e0b" stroke="none"/>
      <circle cx="44" cy="20" r="2" fill="#f59e0b" stroke="none"/>
    </g>
    <text x="200" y="45" fill="#0f172a" font-size="20" font-weight="700">Photoshopped Payment Totals</text>
    <text x="200" y="72" fill="#64748b" font-size="14">Agent edits the 1688 order screenshot to inflate the amount by 5-15%. You never see the real factory price.</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(0, 280)">
    <circle cx="60" cy="50" r="45" fill="#0f172a"/>
    <text x="60" y="60" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="800">02</text>
    <!-- Icon: box + up arrow -->
    <g transform="translate(115, 28)" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 25 L5 10 L25 5 L45 10 L45 25"/>
      <line x1="5" y1="25" x2="45" y2="25"/>
      <line x1="25" y1="5" x2="25" y2="25"/>
      <polyline points="30,40 40,30 50,40"/>
      <line x1="40" y1="30" x2="40" y2="50"/>
    </g>
    <text x="200" y="45" fill="#0f172a" font-size="20" font-weight="700">Overcharged Shipping</text>
    <text x="200" y="72" fill="#64748b" font-size="14">Shipping quoted at 1.5-3× actual cost. The single most common hidden profit source — "shipping costs more than the products."</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(0, 430)">
    <circle cx="60" cy="50" r="45" fill="#0f172a"/>
    <text x="60" y="60" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="800">03</text>
    <!-- Icon: chat bubble + X -->
    <g transform="translate(115, 28)" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 10 Q5 5 10 5 L40 5 Q45 5 45 10 L45 22 Q45 27 40 27 L18 27 L10 34 L10 27 Q5 27 5 22 Z"/>
      <line x1="20" y1="12" x2="30" y2="17"/>
      <line x1="20" y1="17" x2="30" y2="12"/>
      <g transform="translate(35, 32)">
        <circle cx="0" cy="0" r="8" fill="#ef4444" stroke="none"/>
        <line x1="-4" y1="-4" x2="4" y2="4" stroke="#ffffff" stroke-width="2"/>
        <line x1="4" y1="-4" x2="-4" y2="4" stroke="#ffffff" stroke-width="2"/>
      </g>
    </g>
    <text x="200" y="45" fill="#0f172a" font-size="20" font-weight="700">No Real Negotiation</text>
    <text x="200" y="72" fill="#64748b" font-size="14">Agent reports the 1688 listing price as a "negotiated" rate. Their commission drops if they actually negotiate — so they don't.</text>
  </g>

  <!-- Row 4 -->
  <g transform="translate(0, 580)">
    <circle cx="60" cy="50" r="45" fill="#0f172a"/>
    <text x="60" y="60" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="800">04</text>
    <!-- Icon: box + $ -->
    <g transform="translate(115, 28)" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 25 L5 10 L25 5 L45 10 L45 25"/>
      <line x1="5" y1="25" x2="45" y2="25"/>
      <line x1="25" y1="5" x2="25" y2="25"/>
      <text x="28" y="48" fill="#0f172a" font-size="14" font-weight="800" stroke="none">$</text>
    </g>
    <text x="200" y="45" fill="#0f172a" font-size="20" font-weight="700">Inflated Packaging & Add-Ons</text>
    <text x="200" y="72" fill="#64748b" font-size="14">Packaging marked up up to 60%. Higher packaging = higher commission for the agent. You pay twice.</text>
  </g>

  <!-- Row 5 -->
  <g transform="translate(0, 730)">
    <circle cx="60" cy="50" r="45" fill="#0f172a"/>
    <text x="60" y="60" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="800">05</text>
    <!-- Icon: factory + swap arrows -->
    <g transform="translate(115, 28)" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="10" width="25" height="20"/>
      <line x1="5" y1="10" x2="5" y2="2"/>
      <line x1="12" y1="10" x2="12" y2="2"/>
      <line x1="19" y1="10" x2="19" y2="2"/>
      <line x1="5" y1="30" x2="5" y2="35"/>
      <line x1="20" y1="40" x2="35" y2="40"/>
      <polyline points="30,36 35,40 30,44"/>
      <polyline points="40,44 35,40 40,36"/>
    </g>
    <text x="200" y="45" fill="#0f172a" font-size="20" font-weight="700">Switched Suppliers</text>
    <text x="200" y="72" fill="#64748b" font-size="14">Your chosen factory replaced with a cheaper one that pays higher kickbacks. Order screenshot Photoshopped to show your original supplier.</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="840" width="1200" height="60" fill="#f59e0b"/>
  <text x="600" y="878" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="700">Ask the 5 questions before you pay. If they can't answer — walk away.</text>
</svg>